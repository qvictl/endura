[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "endura"
dynamic = ["version"]
description = "Measured, reversible battery-life tuning for Linux laptops, with a GUI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "endura/data/tscsync/LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Endura contributors" }]
keywords = ["linux", "laptop", "battery", "power-management", "amd", "kde", "app-nap"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
    "Topic :: System :: Power (UPS)",
]
# The system services run with the distribution's /usr/bin/python3; `endura-install`
# installs PyQt6, pulsectl, dbus-python and PyGObject there with dnf/apt/pacman.
dependencies = []

[project.optional-dependencies]
gui = ["PyQt6>=6.5"]

[project.urls]
Homepage = "https://github.com/qvictl/endura"
Issues = "https://github.com/qvictl/endura/issues"

[project.scripts]
endura-install = "endura.installer:install"
endura-uninstall = "endura.installer:uninstall"
endura-gui = "endura.installer:gui"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["endura*"]

[tool.setuptools.dynamic]
version = { attr = "endura.__version__" }

[tool.setuptools.package-data]
"*" = ["*.js", "*.json", "*.service", "*.desktop", "*.c", "*.sh", "endura-bench", "LICENSE", "README.md"]
